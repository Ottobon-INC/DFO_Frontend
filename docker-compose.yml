services:
  frontend:
    build: .
    container_name: janmasethu-clinical-frontend
    ports:
      - "8088:80"
    restart: always
    environment:
      - NODE_ENV=production
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:80 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - digital-op-desk-network

networks:
  digital-op-desk-network:
    name: digital-op-desk-network
    external: true
